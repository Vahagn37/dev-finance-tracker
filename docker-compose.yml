services:
  postgres:
    image: postgres:17-alpine
    container_name: finance-tracker-postgres
    environment:
      POSTGRES_DB: finance_tracker
      POSTGRES_USER: finance_tracker
      POSTGRES_PASSWORD: finance_tracker_dev_password
    ports:
      - "54329:5432"
    volumes:
      - finance-tracker-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_tracker -d finance_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/FinanceTracker.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=finance_tracker;Username=finance_tracker;Password=finance_tracker_dev_password
      Jwt__Issuer: FinanceTracker.Api
      Jwt__Audience: FinanceTracker.Client
      Jwt__SigningKey: local-compose-signing-key-change-me-123456789
      Database__ApplyMigrations: "true"
    ports:
      - "5178:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - finance-tracker-data-protection:/root/.aspnet/DataProtection-Keys
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  finance-tracker-postgres-data:
  finance-tracker-data-protection:
